services:
  # -------------------------------------------------------------
  # 1. FastAPI RAG Backend Service
  # -------------------------------------------------------------
  - type: web
    name: ajayramaswamy-rag-platform-2026
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Cheap liveness probe; /health checks every dependency and can be slow
    healthCheckPath: /healthz
    # Deploy on push to main only after the GitHub Actions CI checks pass
    autoDeployTrigger: checksPass
    # Frontend-only commits don't rebuild the backend image
    buildFilter:
      paths:
        - app/**
        - Dockerfile
        - requirements.txt
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      # Generated once by Render and shared with the frontend below; never commit it
      - key: BACKEND_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Next.js Chatbot Frontend Service
  # -------------------------------------------------------------
  - type: web
    name: ajayramaswamy-chat
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AUTH_SECRET
        generateValue: true
      - key: BACKEND_API_KEY
        fromService:
          type: web
          name: ajayramaswamy-rag-platform-2026
          envVarKey: BACKEND_API_KEY
      # Public URL: free-tier services can't receive private-network traffic,
      # so the internal hostname (fromService.property: host) doesn't work here
      - key: BACKEND_API_URL
        value: https://ajayramaswamy-rag-platform-2026.onrender.com
      # Public URL of this service; Auth.js needs it behind Render's proxy
      # (otherwise OAuth callbacks are built as https://localhost:10000/...)
      - key: AUTH_URL
        value: https://ajayramaswamy-chat.onrender.com
      # Optional: only used to generate chat titles
      - key: GROQ_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
